<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome</title>
    <style>
        /* Reset and Base Styles */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #120c1f 0%, #05030a 100%);
            overflow: hidden;
            position: relative;
        }

        /* Animated Background Elements */
        body::before, body::after {
            content: '';
            position: absolute;
            width: 500px;
            height: 500px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(218, 42, 130, 0.15) 0%, rgba(0, 0, 0, 0) 70%);
            top: -10%;
            left: -10%;
            z-index: 0;
            animation: float 12s infinite alternate ease-in-out;
        }

        body::after {
            background: radial-gradient(circle, rgba(138, 43, 226, 0.15) 0%, rgba(0, 0, 0, 0) 70%);
            bottom: -10%;
            right: -10%;
            top: auto;
            left: auto;
            animation: float 12s infinite alternate-reverse ease-in-out;
        }

        @keyframes float {
            0% { transform: translate(0, 0) scale(1); }
            100% { transform: translate(50px, 50px) scale(1.2); }
        }

        /* Main Card Container */
        .card {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px rgba(255, 255, 255, 0.08) solid;
            padding: 3rem 2rem;
            border-radius: 24px;
            text-align: center;
            max-width: 450px;
            width: 90%;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
            z-index: 10;
            transform: translateY(0);
            transition: all 0.3s ease;
        }

        .card:hover {
            border-color: rgba(218, 42, 130, 0.3);
            box-shadow: 0 25px 50px rgba(218, 42, 130, 0.1);
        }

        /* Typography */
        h1 {
            font-size: 2.5rem;
            font-weight: 800;
            color: #ffffff;
            margin-bottom: 1.5rem;
            line-height: 1.2;
            background: linear-gradient(45deg, #ff416c, #ff4b2b);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 10px 20px rgba(255, 65, 108, 0.15);
        }

        p {
            color: #9ca3af;
            font-size: 1.1rem;
            margin-bottom: 2.5rem;
            line-height: 1.6;
        }

        /* Action Button */
        .btn {
            background: linear-gradient(90deg, #da2a82 0%, #8a2be2 100%);
            color: white;
            border: none;
            padding: 1rem 2.5rem;
            font-size: 1.1rem;
            font-weight: 600;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(218, 42, 130, 0.4);
            transition: all 0.3s ease;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(218, 42, 130, 0.6);
            letter-spacing: 0.5px;
        }

        .btn:active {
            transform: translateY(1px);
        }

        /* Popup Modal Styles */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(5, 3, 10, 0.85);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 100;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .modal-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        .modal-content {
            background: #161122;
            border: 2px solid #ef4444;
            padding: 2.5rem;
            border-radius: 20px;
            text-align: center;
            max-width: 400px;
            width: 85%;
            transform: scale(0.8) translateY(20px);
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 0 0 40px rgba(239, 68, 68, 0.2);
        }

        .modal-overlay.active .modal-content {
            transform: scale(1) translateY(0);
        }

        .modal-title {
            font-size: 2rem;
            color: #ef4444;
            font-weight: 700;
            margin-bottom: 1rem;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .modal-text {
            color: #d1d5db;
            font-size: 1.1rem;
            margin-bottom: 2rem;
        }

        .close-btn {
            background: transparent;
            color: #9ca3af;
            border: 1px solid #374151;
            padding: 0.6rem 1.8rem;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 500;
            transition: all 0.2s ease;
        }

        .close-btn:hover {
            background: rgba(255, 255, 255, 0.05);
            color: #ffffff;
            border-color: #6b7280;
        }
    </style>
</head>
<body>

    <!-- Main Landing Card -->
    <div class="card">
        <h1>Welcome freaky smash mommy</h1>
        <p>Unlock premium access to everything you have been looking for.</p>
        <button class="btn" id="seeMoreBtn">See more</button>
    </div>

    <!-- Hidden Popup Modal -->
    <div class="modal-overlay" id="modalOverlay">
        <div class="modal-content">
            <div class="modal-title">Access Denied</div>
            <div class="modal-text">You wish, creep.</div>
            <button class="close-btn" id="closeBtn">Go back</button>
        </div>
    </div>

    <script>
        const seeMoreBtn = document.getElementById('seeMoreBtn');
        const closeBtn = document.getElementById('closeBtn');
        const modalOverlay = document.getElementById('modalOverlay');

        // Open Popup
        seeMoreBtn.addEventListener('click', () => {
            modalOverlay.classList.add('active');
        });

        // Close Popup
        closeBtn.addEventListener('click', () => {
            modalOverlay.classList.remove('active');
        });

        // Close if clicking outside the modal content box
        modalOverlay.addEventListener('click', (e) => {
            if (e.target === modalOverlay) {
                modalOverlay.classList.remove('active');
            }
        });
    </script>
</body>
</html>
